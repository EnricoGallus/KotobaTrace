name: kotoba-trace-production

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: kotoba_trace_production
      POSTGRES_USER: kotoba_trace
      POSTGRES_PASSWORD: ${KOTOBA_TRACE_DATABASE_PASSWORD:?Set KOTOBA_TRACE_DATABASE_PASSWORD in .env.production.local}
    ports:
      - "127.0.0.1:${LOCAL_DATABASE_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kotoba_trace -d kotoba_trace_production"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?Set RAILS_MASTER_KEY in .env.production.local}
      KOTOBA_TRACE_DATABASE_PASSWORD: ${KOTOBA_TRACE_DATABASE_PASSWORD:?Set KOTOBA_TRACE_DATABASE_PASSWORD in .env.production.local}
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      - "127.0.0.1:${LOCAL_APP_PORT:-13000}:80"
    volumes:
      - app_storage:/rails/storage

volumes:
  app_storage:
  postgres_data:
